<!doctype html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin — SPDC</title><link rel="stylesheet" href="styles.css"></head><body><section><div class="wrap admin"><p class="eyebrow">ADMIN DASHBOARD</p><h1>কমিউনিটি ম্যানেজমেন্ট</h1><div id="login" class="admin-card"><p>ডেমো অ্যাডমিন লগইন</p><input id="user" placeholder="Username"><input id="pass" type="password" placeholder="Password"><button class="btn" onclick="login()">Login</button><p id="msg"></p></div><div id="panel" hidden><div class="admin-card"><h2>নোটিশ যোগ করুন</h2><input id="nt" placeholder="নোটিশের শিরোনাম"><input id="nd" placeholder="তারিখ"><button class="btn" onclick="addNotice()">নোটিশ সংরক্ষণ</button><div id="noticeAdmin" class="admin-list"></div></div><div class="admin-card"><h2>লেখা যোগ করুন</h2><input id="at" placeholder="শিরোনাম"><textarea id="ax" placeholder="লেখার সংক্ষিপ্ত বিবরণ"></textarea><button class="btn" onclick="addArticle()">লেখা সংরক্ষণ</button><div id="articleAdmin" class="admin-list"></div></div><p><a class="btn outline" href="index.html">সাইট দেখুন</a> <button class="btn outline" onclick="logout()">Logout</button></p><p class="admin-note">নোট: এই ডেমো ড্যাশবোর্ড browser localStorage ব্যবহার করে। shared production data-এর জন্য database/API যুক্ত করা প্রয়োজন।</p></div></div></section><script src="admin.js"></script></body></html>
