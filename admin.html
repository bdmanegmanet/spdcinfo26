<!doctype html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin — SPDC</title><link rel="stylesheet" href="styles.css"></head><body><section><div class="wrap" style="max-width:760px"><p class="eyebrow">ADMIN DASHBOARD</p><h1>কমিউনিটি ম্যানেজমেন্ট</h1><div id="login"><p>ডেমো অ্যাডমিন লগইন</p><input id="user" placeholder="Username" style="padding:12px;width:100%;margin:6px 0"><input id="pass" type="password" placeholder="Password" style="padding:12px;width:100%;margin:6px 0"><button class="btn" onclick="login()">Login</button><p id="msg"></p></div><div id="panel" hidden><h2>নোটিশ যোগ</h2><input id="nt" placeholder="নোটিশের শিরোনাম" style="padding:12px;width:100%;margin:6px 0"><input id="nd" placeholder="তারিখ" style="padding:12px;width:100%;margin:6px 0"><button class="btn" onclick="addNotice()">নোটিশ সংরক্ষণ</button><h2 style="margin-top:35px">লেখা যোগ</h2><input id="at" placeholder="শিরোনাম" style="padding:12px;width:100%;margin:6px 0"><textarea id="ax" placeholder="লেখার সংক্ষিপ্ত বিবরণ" style="padding:12px;width:100%;height:120px;margin:6px 0"></textarea><button class="btn" onclick="addArticle()">লেখা সংরক্ষণ</button><p><a class="btn outline" href="index.html">সাইট দেখুন</a> <button class="btn outline" onclick="logout()">Logout</button></p></div></div></section><script src="admin.js"></script></body></html>
