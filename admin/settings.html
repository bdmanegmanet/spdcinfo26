<!doctype html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Website Settings</title><link rel="stylesheet" href="../css/style.css"></head><body><main class="section"><div class="wrap"><h1>Website Settings</h1><div class="card"><form class="form" id="f"><input name="name" placeholder="মাদ্রাসার নাম"><input name="arabicName" placeholder="Arabic Name"><input name="logo" placeholder="Logo URL"><input name="motto" placeholder="Motto"><input name="phone" placeholder="Phone"><input name="email" placeholder="Email"><input name="address" placeholder="Address"><input name="founded" placeholder="Founded Year"><input name="principal" placeholder="Principal"><textarea name="description" placeholder="Description"></textarea><textarea name="vision" placeholder="Mission & Vision"></textarea><input name="seoTitle" placeholder="SEO Title"><textarea name="seoDescription" placeholder="SEO Description"></textarea><input name="theme" value="#0F766E" placeholder="Theme Color"><textarea name="footer" placeholder="Footer"></textarea><button class="btn">Save Settings</button></form><p id="m"></p></div></div></main><script src="../js/api.js"></script><script src="../js/auth.js"></script><script>Auth.required();async function load(){await syncWebsiteData();const s=STORE.data.settings||{};Object.keys(s).forEach(k=>{if(f[k])f[k].value=s[k]||''})}f.onsubmit=async e=>{e.preventDefault();const data={};Array.from(f.elements).forEach(x=>{if(x.name)data[x.name]=x.value});data.id=STORE.data.settings?.id||'SETTINGS-1';const r=await apiRequest('updateData',{sheet:'Settings',id:data.id,data},Auth.get());if(!r.success&&/not found/i.test(r.message||''))await apiRequest('saveData',{sheet:'Settings',data},Auth.get());m.textContent=r.success?'Settings saved.':(r.message||'Saved');await syncWebsiteData()};load()</script></body></html>
