<!doctype html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin Login</title><link rel="stylesheet" href="../css/style.css"></head><body><main style="min-height:100vh;display:grid;place-items:center;padding:20px;background:#f8fafc"><div class="card" style="width:min(420px,100%);padding:28px"><h1>Admin Login</h1><p>মাদ্রাসা Management System</p><form id="f"><input id="u" required placeholder="Username" style="width:100%;padding:12px;margin:8px 0"><input id="p" required type="password" placeholder="Password" style="width:100%;padding:12px;margin:8px 0"><button class="btn" style="width:100%" type="submit">Login</button><p id="msg"></p></form></div></main><script src="../js/data.js"></script><script src="../js/api.js"></script><script src="../js/auth.js"></script><script>f.onsubmit=async e=>{e.preventDefault();msg.textContent='লগইন হচ্ছে…';try{await Auth.login(u.value,p.value);location.href='dashboard.html'}catch(x){msg.textContent=x.message}};</script></body></html>
