<!doctype html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin Dashboard</title><link rel="stylesheet" href="../css/style.css"></head><body><main class="section"><div class="wrap"><div style="display:flex;justify-content:space-between;align-items:center"><h1>মাদ্রাসা Admin Dashboard</h1><button class="btn gold" onclick="Auth.clear();location.href='login.html'">Logout</button></div><div class="stats" id="stats"></div><div class="card" style="margin-top:20px"><h2>Database Tools</h2><div class="actions"><button class="btn" onclick="setup()">Initialize Database</button><button class="btn gold" onclick="backup()">Backup</button><a class="btn" href="settings.html">Website Settings</a><a class="btn" href="api.html">API & Sync</a><a class="btn" href="apps-script.html">Apps Script</a></div><p id="msg"></p></div><div class="card" style="margin-top:20px"><h2>নতুন নোটিশ</h2><form class="form" id="nf"><input name="title" placeholder="শিরোনাম" required><select name="category"><option>জরুরি নোটিশ</option><option>একাডেমিক</option><option>পরীক্ষা</option><option>ফলাফল</option><option>ভর্তি</option><option>সাধারণ</option></select><textarea name="details" placeholder="বিস্তারিত"></textarea><input name="pdfUrl" placeholder="PDF URL"><button class="btn">Save Notice</button></form></div><div class="card" style="margin-top:20px"><h2>সর্বশেষ নোটিশ</h2><div id="notices"></div></div></div></main><script src="../js/api.js"></script><script src="../js/auth.js"></script><script>Auth.required();const esc=x=>String(x??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));async function load(){await syncWebsiteData();const d=STORE.data;stats.innerHTML=['students','teachers','courses','notices','events','gallery','admission','messages'].map(k=>'<div class="stat"><strong>'+((d[k]||[]).length)+'</strong>'+k+'</div>').join('');notices.innerHTML=(d.notices||[]).slice(-10).reverse().map(n=>'<div class="notice"><span><b>'+esc(n.title)+'</b><br>'+esc(n.category||'')+'</span><button class="btn" onclick="removeN(\''+esc(n.id)+'\')">Delete</button></div>').join('')||'কোনো নোটিশ নেই।'}nf.onsubmit=async e=>{e.preventDefault();const r=await apiRequest('saveData',{sheet:'Notices',data:{title:nf.title.value,category:nf.category.value,details:nf.details.value,pdfUrl:nf.pdfUrl.value,publishDate:new Date().toISOString(),important:false,status:'published'}},Auth.get());msg.textContent=r.success?'সংরক্ষণ হয়েছে।':r.message;await load()};async function removeN(id){if(!confirm('মুছবেন?'))return;await apiRequest('deleteData',{sheet:'Notices',id},Auth.get());await load()}async function setup(){const r=await apiRequest('setupSheets',{},Auth.get());msg.textContent=r.success?'Database initialized.':r.message}async function backup(){const r=await apiRequest('backupData',{},Auth.get());msg.textContent=r.success?'Backup created.':r.message}load().catch(e=>msg.textContent=e.message)</script></body></html>
