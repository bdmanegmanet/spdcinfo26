<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Admin Dashboard — Madrasa CMS</title>
<link rel="stylesheet" href="../css/style.css"><link rel="stylesheet" href="../css/admin.css">
<style>
:root{--p:#0f766e;--g:#15803d;--a:#d97706;--bg:#f8fafc;--dark:#0f172a}
body{background:var(--bg)}.admin-shell{display:grid;grid-template-columns:250px 1fr;min-height:100vh}.side{background:#0f172a;color:#fff;padding:18px;position:sticky;top:0;height:100vh;overflow:auto}.side h2{font-size:18px;margin:0 0 15px}.side button{display:block;width:100%;text-align:left;border:0;background:transparent;color:#cbd5e1;padding:10px 12px;border-radius:8px;margin:3px 0;cursor:pointer}.side button.active,.side button:hover{background:#134e4a;color:#fff}.main{padding:22px;min-width:0}.top{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}.toolbar,.filters,.form-grid{display:grid;gap:10px}.toolbar{grid-template-columns:1fr auto auto auto}.filters{grid-template-columns:2fr 1fr 1fr 1fr}.form-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.full{grid-column:1/-1}.field label{display:block;font-size:13px;font-weight:700;margin-bottom:5px}.field input,.field textarea,.field select{width:100%;box-sizing:border-box;padding:10px;border:1px solid #cbd5e1;border-radius:8px;background:#fff}.field textarea{min-height:90px;resize:vertical}.table-wrap{overflow:auto;border:1px solid #e2e8f0;border-radius:10px;background:#fff}.crud-table{width:100%;border-collapse:collapse;min-width:850px}.crud-table th,.crud-table td{padding:9px;border-bottom:1px solid #e2e8f0;text-align:left;font-size:13px;vertical-align:top}.crud-table th{background:#f1f5f9;position:sticky;top:0}.actions{display:flex;gap:6px;flex-wrap:wrap}.btn-sm{padding:6px 9px;border:0;border-radius:7px;cursor:pointer;background:#0f766e;color:#fff}.btn-danger{background:#b91c1c}.btn-light{background:#e2e8f0;color:#0f172a}.pager{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:12px}.stat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:18px 0}.stat-card{background:#fff;border:1px solid #e2e8f0;border-radius:12px;padding:15px}.stat-card strong{display:block;font-size:25px;color:var(--p)}.modal{position:fixed;inset:0;background:#0008;display:none;align-items:center;justify-content:center;padding:16px;z-index:20}.modal.open{display:flex}.modal-box{background:#fff;border-radius:14px;width:min(900px,100%);max-height:92vh;overflow:auto;padding:20px}.muted{color:#64748b;font-size:13px}.toast{position:fixed;right:16px;bottom:16px;background:#0f172a;color:#fff;padding:12px 16px;border-radius:9px;display:none;z-index:50}.toast.show{display:block}.mobile-nav{display:none}
@media(max-width:850px){.admin-shell{grid-template-columns:1fr}.side{height:auto;position:relative}.side nav{display:flex;overflow:auto;gap:4px}.side button{white-space:nowrap;width:auto}.toolbar,.filters,.form-grid{grid-template-columns:1fr}.stat-grid{grid-template-columns:repeat(2,1fr)}.mobile-nav{display:block}}
</style>
</head>
<body>
<div class="admin-shell">
<aside class="side"><h2>☪ Madrasa CMS</h2><nav id="nav"></nav><hr><button onclick="location.href='settings.html'">⚙ Website Settings</button><button onclick="location.href='api.html'">↔ API & Sync</button><button onclick="location.href='apps-script.html'">▣ Apps Script</button><button onclick="backup()">▣ Backup</button><button onclick="logout()">↪ Logout</button></aside>
<main class="main">
<div class="top"><div><h1 id="title">Dashboard</h1><div class="muted" id="syncStatus">Loading database…</div></div><div class="actions"><button class="btn" onclick="load()">↻ Refresh</button><button class="btn gold" onclick="openForm()">＋ Add Record</button></div></div>
<section id="home"></section>
<section id="manager" style="display:none">
<div class="card">
<div class="toolbar"><input id="search" placeholder="Search records…"><select id="pageSize"><option>10</option><option>20</option><option>50</option><option>100</option></select><button class="btn btn-light" onclick="exportCSV()">Export CSV</button><button class="btn btn-danger" onclick="bulkDelete()">Delete Selected</button></div>
<div class="filters" style="margin-top:10px"><select id="statusFilter"><option value="">All status</option><option>active</option><option>published</option><option>pending</option><option>approved</option><option>rejected</option><option>contacted</option><option>open</option><option>closed</option><option>inactive</option></select><select id="filter1"><option value="">Filter 1</option></select><select id="filter2"><option value="">Filter 2</option></select><select id="filter3"><option value="">Filter 3</option></select></div>
<div id="table" style="margin-top:14px"></div><div class="pager"><span id="count"></span><div class="actions"><button class="btn btn-light" onclick="prev()">‹ Prev</button><span id="pg"></span><button class="btn btn-light" onclick="next()">Next ›</button></div></div>
</div></section>
</main></div>
<div class="modal" id="modal"><div class="modal-box"><div class="top"><h2 id="formTitle">Add Record</h2><button class="btn btn-light" onclick="closeForm()">✕</button></div><form id="recordForm"><div class="form-grid" id="fields"></div><div class="actions" style="margin-top:14px"><button class="btn" type="submit">Save</button><button class="btn btn-light" type="button" onclick="closeForm()">Cancel</button></div></form></div></div>
<div class="toast" id="toast"></div>
<script src="../js/api.js"></script><script src="../js/auth.js"></script>
<script>
Auth.required();
const SCHEMA={
Notices:['id','title','category','details','pdfUrl','publishDate','important','status'],
News:['id','title','author','thumbnail','short','details','category','tags','date','status'],
Events:['id','title','description','image','startDate','endDate','location','status'],
Teachers:['id','name','photo','designation','department','subject','education','experience','mobile','email','joiningDate','status','bio'],
Staff:['id','name','photo','designation','department','mobile','email','joiningDate','status','bio'],
Students:['id','studentId','name','photo','roll','registration','class','department','session','gender','guardian','mobile','status'],
Courses:['id','name','department','class','description','duration','fee','status'],
Departments:['id','name','description','head','status'],
Classes:['id','name','section','shift','department','status'],
Admission:['id','name','father','mother','dob','gender','previousInstitution','previousResult','class','department','mobile','guardianMobile','address','photo','documents','status','createdAt'],
Results:['id','studentId','roll','name','class','exam','subject','marks','gpa','grade','result','status'],
Routine:['id','type','class','day','period','subject','teacher','time','room','status'],
Gallery:['id','title','imageUrl','category','date','description','status'],
Videos:['id','title','youtubeUrl','thumbnail','category','description','status'],
Articles:['id','title','author','thumbnail','short','details','category','tags','date','status'],
FAQ:['id','question','answer','category','status'],
Messages:['id','name','mobile','email','subject','message','status','createdAt'],
Contact:['id','name','email','mobile','subject','message','status','createdAt'],
Donations:['id','method','accountName','accountNumber','instructions','qrUrl','status']
};
const MENU=[...Object.keys(SCHEMA),'Dashboard'];
let sheet='';let rows=[];let page=1;let editId=null;
const esc=x=>String(x??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const val=x=>String(x??'');
function logout(){Auth.clear();location.href='login.html'}
function toast(s){const t=document.getElementById('toast');t.textContent=s;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2500)}
function nav(){document.getElementById('nav').innerHTML=MENU.map(x=>'<button class="'+(sheet===x?'active':'')+'" onclick="selectSheet(\''+x+'\')">'+(x==='Dashboard'?'▦ Dashboard':x)+'</button>').join('')}
function selectSheet(s){sheet=s;page=1;nav();document.getElementById('home').style.display=s==='Dashboard'?'block':'none';document.getElementById('manager').style.display=s==='Dashboard'?'none':'block';document.getElementById('title').textContent=s==='Dashboard'?'Dashboard':s; if(s!=='Dashboard'){configureFilters();render()}}
async function load(){try{const r=await syncWebsiteData();if(!r.success)throw Error(r.message||'API error');document.getElementById('syncStatus').textContent='Database synced • '+new Date().toLocaleString();if(sheet==='Dashboard')dashboard();else{rows=STORE.data[sheet.toLowerCase()]||[];configureFilters();render()}}catch(e){document.getElementById('syncStatus').textContent='Offline / API unavailable';toast(e.message)}}
function dashboard(){const d=STORE.data;const keys=Object.keys(SCHEMA);document.getElementById('home').innerHTML='<div class="stat-grid">'+keys.slice(0,8).map(k=>'<div class="stat-card"><span>'+k+'</span><strong>'+((d[k.toLowerCase()]||[]).length)+'</strong></div>').join('')+'</div><div class="card"><h2>Management System</h2><p class="muted">একই Dashboard থেকে Add, Edit, Delete, Search, Filter, Pagination, Bulk Delete এবং CSV Export করা যাবে। বাম পাশ থেকে যেকোনো module নির্বাচন করুন।</p></div>'}
function configureFilters(){const all=rows;const candidates=[['filter1','department'],['filter2','class'],['filter3','category']];candidates.forEach(([id,key])=>{const el=document.getElementById(id);const vals=[...new Set(all.map(r=>val(r[key])).filter(Boolean))].sort();el.innerHTML='<option value="">'+key+' — All</option>'+vals.map(v=>'<option value="'+esc(v)+'">'+esc(v)+'</option>').join('')});['search','statusFilter','filter1','filter2','filter3','pageSize'].forEach(id=>document.getElementById(id).oninput=()=>{page=1;render()})}
function filtered(){const q=document.getElementById('search').value.toLowerCase().trim(),st=document.getElementById('statusFilter').value;const fs=[['department',document.getElementById('filter1').value],['class',document.getElementById('filter2').value],['category',document.getElementById('filter3').value]];return rows.filter(r=>(!q||Object.values(r).some(v=>val(v).toLowerCase().includes(q)))&&(!st||val(r.status)===st)&&fs.every(([k,v])=>!v||val(r[k])===v))}
function render(){const data=filtered(),size=+document.getElementById('pageSize').value||10,total=Math.max(1,Math.ceil(data.length/size));if(page>total)page=total;const part=data.slice((page-1)*size,page*size),fields=SCHEMA[sheet]||[];document.getElementById('count').textContent=data.length+' records';document.getElementById('pg').textContent=page+' / '+total;document.getElementById('table').innerHTML='<div class="table-wrap"><table class="crud-table"><thead><tr><th><input type="checkbox" onchange="toggleAll(this)"></th>'+fields.map(f=>'<th>'+f+'</th>').join('')+'<th>Actions</th></tr></thead><tbody>'+part.map(r=>'<tr><td><input class="rowcheck" type="checkbox" value="'+esc(r.id)+'"></td>'+fields.map(f=>'<td>'+esc(val(r[f]).slice(0,180))+'</td>').join('')+'<td><div class="actions"><button class="btn-sm" onclick="openForm(\''+esc(r.id)+'\')">Edit</button><button class="btn-sm btn-danger" onclick="removeOne(\''+esc(r.id)+'\')">Delete</button></div></td></tr>').join('')+'</tbody></table></div>'}
function prev(){if(page>1){page--;render()}}function next(){const total=Math.ceil(filtered().length/(+document.getElementById('pageSize').value||10));if(page<total){page++;render()}}
function toggleAll(el){document.querySelectorAll('.rowcheck').forEach(x=>x.checked=el.checked)}
function openForm(id=''){editId=id;const fields=SCHEMA[sheet]||[];const rec=id?rows.find(r=>val(r.id)===val(id))||{}:{};document.getElementById('formTitle').textContent=(id?'Edit ':'Add ')+sheet;document.getElementById('fields').innerHTML=fields.map(f=>{const big=['details','description','bio','short','answer','message','instructions','documents','tags','address'].includes(f);const type=/date/i.test(f)&&f!=='createdAt'?'date':'text';const readonly=f==='id'&&!!id;return '<div class="field '+(big?'full':'')+'"><label>'+f+'</label>'+ (big?'<textarea name="'+f+'" '+(readonly?'readonly':'')+'>'+esc(rec[f])+'</textarea>':'<input type="'+type+'" name="'+f+'" value="'+esc(rec[f])+'" '+(readonly?'readonly':'')+'>')+'</div>'}).join('');document.getElementById('modal').classList.add('open')}
function closeForm(){document.getElementById('modal').classList.remove('open')}
document.getElementById('recordForm').onsubmit=async e=>{e.preventDefault();const data={};new FormData(e.target).forEach((v,k)=>data[k]=v);if(!data.id&&!editId)data.id='';try{const action=editId?'updateData':'saveData';const payload=editId?{sheet,id:editId,data}:{sheet,data};const r=await apiRequest(action,payload,Auth.get());if(!r.success)throw Error(r.message||'Save failed');toast(editId?'Updated successfully':'Added successfully');closeForm();await load()}catch(err){toast(err.message)}}
async function removeOne(id){if(!confirm('এই record মুছে ফেলবেন?'))return;try{const r=await apiRequest('deleteData',{sheet,id},Auth.get());if(!r.success)throw Error(r.message||'Delete failed');toast('Deleted');await load()}catch(e){toast(e.message)}}
async function bulkDelete(){const ids=[...document.querySelectorAll('.rowcheck:checked')].map(x=>x.value);if(!ids.length)return toast('কোনো record নির্বাচন করা হয়নি');if(!confirm(ids.length+'টি record মুছবেন?'))return;for(const id of ids){const r=await apiRequest('deleteData',{sheet,id},Auth.get());if(!r.success)return toast(r.message||'Delete failed')}toast(ids.length+'টি record deleted');await load()}
function exportCSV(){const data=filtered(),fields=SCHEMA[sheet];const csv=[fields,...data.map(r=>fields.map(f=>{let x=val(r[f]).replaceAll('"','""');return '"'+x+'"' }))].map(a=>a.join(',')).join('\n');const blob=new Blob(['\ufeff'+csv],{type:'text/csv;charset=utf-8'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=sheet+'-export.csv';a.click();URL.revokeObjectURL(a.href)}
async function backup(){try{const r=await apiRequest('backupData',{},Auth.get());toast(r.success?'Backup created':'Backup failed')}catch(e){toast(e.message)}}
nav();load();
</script></body></html>
