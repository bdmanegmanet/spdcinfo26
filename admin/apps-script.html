<!doctype html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Apps Script Code</title><link rel="stylesheet" href="../css/style.css"></head><body><main class="section"><div class="wrap"><h1>Google Apps Script</h1><div class="card"><p>Backend source: <code>backend/Code.gs</code></p><button class="btn" onclick="copy()">Copy Code</button><button class="btn gold" onclick="download()">Download Code.gs</button><pre id="code" style="white-space:pre-wrap;background:#0f172a;color:#fff;padding:16px;border-radius:10px">Open repository backend/Code.gs to view the current source.</pre></div></div></main><script src="../js/auth.js"></script><script>Auth.required();const codeText='Google Apps Script source is maintained in backend/Code.gs';code.textContent=codeText;function copy(){navigator.clipboard.writeText(codeText)}function download(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([codeText],{type:'text/plain'}));a.download='Code.gs';a.click()}</script></body></html>
